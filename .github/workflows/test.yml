name: LAYLA2 Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Layla GGUF model
        run: |
          mkdir -p models
          wget --show-progress \
            -O models/SmolLM2-135M-Instruct-Q4_K_M.gguf \
            "https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf?download=true"

      - name: Check model
        run: |
          ls -lh models/SmolLM2-135M-Instruct-Q4_K_M.gguf
          test -s models/SmolLM2-135M-Instruct-Q4_K_M.gguf

      - name: Check Python syntax
        run: |
          python -m py_compile main.py app.py layla_engine.py

      - name: Test Layla response
        run: |
          python main.py "Hello Layla"

      - name: Test Layla memory
        run: |
          python main.py --test-memory

      - name: Check project structure
        run: |
          test -f main.py
          test -f app.py
          test -f layla_engine.py
          test -f requirements.txt
          test -f models/SmolLM2-135M-Instruct-Q4_K_M.gguf
          echo "LAYLA2 project structure OK"

      - name: Complete
        run: |
          echo "LAYLA2 local AI and memory tests completed successfully."
